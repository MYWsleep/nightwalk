<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜归 · Nightwalk</title>
<style>
  :root{
    --ink:#05060a;
    --paper:#e8eef5;
    --dim:#7b8798;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;
    color:var(--paper);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    cursor:none;
    user-select:none;
    -webkit-user-select:none;
  }
  body.showcursor{cursor:default}
  #stage{
    position:relative;
    width:min(100vw, 177.78vh);
    height:min(56.25vw, 100vh);
    background:#000;
    overflow:hidden;
    box-shadow:0 0 120px rgba(0,0,0,.9) inset;
  }
  #game{
    position:absolute;inset:0;
    width:100%;height:100%;
    display:block;
    /* 高清渲染：不再像素化，保留细节 */
  }

  /* ---------- 画面叠加层 ---------- */
  .layer{position:absolute;inset:0;pointer-events:none}
  #scan{
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 3px,
      rgba(0,0,0,.16) 4px,
      rgba(0,0,0,0) 5px
    );
    mix-blend-mode:multiply;
    opacity:.20;
  }
  #vig{
    background:radial-gradient(ellipse at 50% 46%,
      rgba(0,0,0,0) 34%,
      rgba(0,0,0,.30) 68%,
      rgba(0,0,0,.86) 100%);
  }
  #tint{
    background:transparent;
    transition:background .5s linear;
    mix-blend-mode:screen;
    opacity:.5;
  }
  #flick{
    background:#fff;opacity:0;
    mix-blend-mode:screen;
  }

  /* ---------- 字幕 ---------- */
  #sub{
    position:absolute;left:0;right:0;bottom:9%;
    text-align:center;
    font-size:calc(clamp(13px, 1.55vw, 22px) * var(--txt, 1));
    letter-spacing:.08em;
    line-height:1.7;
    color:#cfd8e3;
    text-shadow:0 0 12px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,1);
    opacity:0;
    transition:opacity .7s ease;
    padding:0 12%;
    white-space:pre-line;
  }
  #sub.on{opacity:1}
  #sub.eerie{color:#c9a0a0}
  #card.fray .cn, #card.fray .en, #cover.fray .body, #cover.fray .btn{
    color:#d8b6b6;
    text-shadow:0 0 14px rgba(120,0,0,.5), 0 0 3px rgba(0,0,0,1);
    animation:fray 1.3s steps(3) infinite;
  }
  #sub.fray{
    color:#d8b6b6;
    text-shadow:0 0 12px rgba(120,0,0,.55), 0 0 3px rgba(0,0,0,1);
    animation:fray 1.1s steps(3) infinite;
  }
  @keyframes fray{
    0%{transform:translateX(0) skewX(0)}
    33%{transform:translateX(-1px) skewX(-1.2deg)}
    66%{transform:translateX(1.4px) skewX(.9deg)}
    100%{transform:translateX(0) skewX(0)}
  }

  /* ---------- 章节卡 ---------- */
  #card{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:1.2vw;
    background:#000;
    opacity:0;
    transition:opacity 1s ease;
    pointer-events:none;
  }
  #card.on{opacity:1}
  #card .cn{
    font-size:calc(clamp(20px, 3.1vw, 44px) * var(--txt, 1));
    letter-spacing:.35em;
    color:#dfe7f0;
    text-shadow:0 0 30px rgba(120,150,190,.35);
  }
  #card .en{
    font-size:clamp(9px, 1vw, 14px);
    letter-spacing:.55em;
    color:#5d6a7c;
    text-transform:uppercase;
  }
  #card .rule{
    width:clamp(60px, 9vw, 140px);height:1px;
    background:linear-gradient(90deg,transparent,#4a5666,transparent);
    margin-top:.4vw;
  }

  /* ---------- 封面 / 结束 ---------- */
  #cover{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:1.4vw;
    background:radial-gradient(ellipse at 50% 45%, #0a0e16 0%, #000 78%);
    transition:opacity .9s ease;
  }
  #cover.hide{opacity:0;pointer-events:none}
  #cover h1{
    font-size:clamp(30px, 5.4vw, 78px);
    font-weight:400;
    letter-spacing:.6em;
    text-indent:.6em;
    color:#e6edf5;
    text-shadow:0 0 40px rgba(140,170,210,.25), 0 0 6px rgba(0,0,0,.9);
  }
  #cover .sub{
    font-size:clamp(10px, 1.05vw, 15px);
    letter-spacing:.5em;
    color:#6b7889;
    text-indent:.5em;
  }
  #cover .hint{
    margin-top:2.2vw;
    font-size:clamp(11px, 1.15vw, 16px);
    letter-spacing:.22em;
    color:#8e9bad;
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
  #cover .key{
    display:inline-block;
    border:1px solid #4b5768;
    border-radius:5px;
    padding:.12em .5em;
    margin:0 .25em;
    color:#c3cedb;
    font-size:.92em;
  }
  #cover .tiny{
    position:absolute;bottom:4%;
    font-size:clamp(8px,.85vw,12px);
    letter-spacing:.2em;color:#3d4757;
  }
  #cover.endq h1{letter-spacing:.3em;font-size:clamp(22px,3.4vw,52px);text-indent:.3em}
  #cover .body{
    max-width:64%;
    text-align:center;
    font-size:calc(clamp(11px,1.1vw,16px) * var(--txt, 1));
    line-height:2;
    color:#98a4b4;
    letter-spacing:.06em;
    white-space:pre-line;
  }
  #cover .btn{
    pointer-events:auto;
    margin-top:1.6vw;
    border:1px solid #46525f;
    background:rgba(255,255,255,.02);
    color:#c9d4e0;
    padding:.55em 1.9em;
    border-radius:3px;
    letter-spacing:.3em;
    font-size:clamp(10px,1vw,14px);
    font-family:inherit;
    cursor:pointer;
    transition:all .25s ease;
  }
  #cover .btn:hover{background:rgba(255,255,255,.08);border-color:#7b8a9c}

  /* ---------- 菜单按钮（封面 / 暂停共用） ---------- */
  .menu{display:flex;flex-direction:column;align-items:center;gap:.9vh}
  .menu .btn{
    pointer-events:auto;
    min-width:15em;
    border:1px solid #46525f;
    background:rgba(255,255,255,.02);
    color:#c9d4e0;
    padding:.62em 1.6em;
    border-radius:3px;
    letter-spacing:.26em;
    font-size:clamp(10px,1vw,14px);
    font-family:inherit;
    cursor:pointer;
    transition:all .25s ease;
  }
  .menu .btn:hover{background:rgba(255,255,255,.08);border-color:#7b8a9c;color:#eaf1f8}
  .menu .btn.ghost{color:#7d8a99}
  .menu .btn .small{letter-spacing:.08em;opacity:.6;font-size:.85em}

  /* ---------- 设置层 ---------- */
  #settings{
    position:absolute;inset:0;
    display:none;flex-direction:column;
    align-items:center;justify-content:center;
    gap:1.4vh;
    background:rgba(3,5,8,.88);
    backdrop-filter:blur(2px) saturate(.7);
    z-index:30;
  }
  #settings.on{display:flex;animation:pauseIn .18s ease}
  #settings .stitle{
    font-size:calc(clamp(15px,1.9vw,24px) * var(--txt, 1));
    letter-spacing:.5em;text-indent:.5em;color:#dfe8f2;
  }
  #settings .slist{display:flex;flex-direction:column;gap:1.0vh;min-width:min(66vw,420px)}
  #settings .srow{
    display:flex;align-items:center;gap:1.2vw;
    font-size:calc(clamp(10px,1vw,14px) * var(--txt, 1));
    letter-spacing:.28em;color:#93a1b0;
  }
  #settings .srow>span{flex:0 0 7.4em}
  #settings input[type=range]{
    flex:1 1 auto;height:16px;accent-color:#8d9fb2;background:transparent;cursor:pointer;
  }
  #settings .srow b{
    flex:0 0 3.4em;text-align:right;font-weight:400;color:#c9d4de;letter-spacing:.1em;
  }
  #settings .tog{
    flex:0 0 4.8em;padding:.5em 0;
    background:rgba(255,255,255,.03);border:1px solid rgba(160,180,200,.28);
    color:#93a1b0;font:inherit;font-size:calc(clamp(10px,1vw,14px) * var(--txt, 1));
    letter-spacing:.3em;text-indent:.3em;cursor:pointer;
  }
  #settings .tog.on{color:#e6eef6;border-color:#7b8a9c;background:rgba(255,255,255,.08)}
  #settings .btn{
    padding:.7em 2.4em;background:rgba(255,255,255,.03);
    border:1px solid rgba(160,180,200,.28);color:#c3cedb;
    font:inherit;font-size:calc(clamp(10px,1vw,14px) * var(--txt, 1));
    letter-spacing:.4em;text-indent:.4em;cursor:pointer;
  }
  #settings .btn:hover{background:rgba(255,255,255,.08);border-color:#7b8a9c}
  #settings .shint{
    font-size:calc(clamp(8px,.85vw,12px) * var(--txt, 1));
    letter-spacing:.3em;color:#5b6672;
  }

  /* ---------- 暂停层 ---------- */
  #pause{
    position:absolute;inset:0;
    display:none;flex-direction:column;
    align-items:center;justify-content:center;
    gap:1.1vh;
    background:rgba(2,4,7,.74);
    backdrop-filter:blur(1px) saturate(.7);
    z-index:20;
  }
  #pause.on{display:flex;animation:pauseIn .22s ease}
  @keyframes pauseIn{from{opacity:0}to{opacity:1}}
  #pause .ptitle{
    font-size:clamp(18px,2.3vw,30px);
    letter-spacing:.5em;text-indent:.5em;
    color:#dfe8f2;
    text-shadow:0 0 24px rgba(120,150,190,.25);
  }
  #pause .psub{
    font-size:clamp(9px,.85vw,12px);
    letter-spacing:.3em;color:#66717f;
    margin-bottom:1.6vh;
  }

  /* ---------- 跳跃惊吓全屏层（DOM 层做红闪 / 撕裂） ---------- */
  #jolt{
    position:absolute;inset:0;pointer-events:none;
    background:#000;opacity:0;
  }
  #jolt.on{animation:jolt .42s steps(3,end)}
  @keyframes jolt{
    0%{opacity:1;background:#fff;transform:translate(0,0)}
    25%{opacity:.9;background:#7a0d0d;transform:translate(3px,-2px)}
    50%{opacity:.55;background:#000;transform:translate(-4px,2px)}
    75%{opacity:.3;background:#7a0d0d;transform:translate(2px,1px)}
    100%{opacity:0;transform:translate(0,0)}
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div class="layer" id="tint"></div>
    <div class="layer" id="scan"></div>
    <div class="layer" id="vig"></div>
    <div class="layer" id="flick"></div>
    <div id="pause">
      <div class="ptitle">已 暂 停</div>
      <div class="psub" id="pause-sub">ESC 继续 · 进度会存在这台机器上</div>
      <div class="menu" id="pause-menu">
        <button class="btn" data-act="resume">继 续</button>
        <button class="btn" data-act="menu">保 存 并 返 回 主 界 面</button>
        <button class="btn" data-act="settings">设 置</button>
        <button class="btn" data-act="exit">返 回 桌 面</button>
      </div>
    </div>

    <div id="settings">
      <div class="stitle">设 置</div>
      <div class="slist">
        <div class="srow"><span>音 量</span><input id="set-vol" type="range" min="0" max="100" step="1" value="55"><b id="set-vol-v">55</b></div>
        <div class="srow"><span>静 音</span><button class="tog" id="set-mute">关</button></div>
        <div class="srow"><span>字 号</span><input id="set-txt" type="range" min="80" max="140" step="5" value="100"><b id="set-txt-v">100%</b></div>
        <div class="srow"><span>减 少 闪 烁</span><button class="tog" id="set-safe">关</button></div>
        <div class="srow"><span>全 屏</span><button class="tog" id="set-full">关</button></div>
      </div>
      <div class="sfoot"><button class="btn" data-act="close">返 回</button></div>
      <div class="shint">ESC 也 可 以 返 回</div>
    </div>

    <div class="layer" id="jolt"></div>
    <div id="sub"></div>

    <div id="card">
      <div class="en" id="card-en">chapter one</div>
      <div class="cn" id="card-cn">下 班</div>
      <div class="rule"></div>
    </div>

    <div id="cover">
      <h1 id="cover-title">夜 归</h1>
      <div class="sub" id="cover-sub">N I G H T W A L K</div>
      <div class="body" id="cover-body" style="display:none"></div>
      <div class="hint" id="cover-hint">
        按住 <span class="key">←</span> 向左走 · 你只能向左走
      </div>
      <div class="menu" id="cover-menu"></div>
      <div class="tiny">戴上耳机 · 关掉灯 · 建议单独游玩</div>
    </div>
  </div>

  <script src="src/util.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/art.js"></script>
  <script src="src/chapters.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
